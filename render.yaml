services:
  # ── FastAPI backend ──────────────────────────────────────────────────────
  - type: web
    name: datepilot-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://datepilot.onrender.com
      - key: OLLAMA_BASE_URL
        # Point to a hosted open-weight endpoint (e.g. Groq or OpenRouter that
        # accepts /v1/chat/completions), or leave as localhost for local dev
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: gemma2-9b-it
      - key: VISION_MODEL
        value: llava-v1.5-7b-4096-preview
      - key: SECRET_KEY
        generateValue: true

  # ── React / Vite static frontend ────────────────────────────────────────
  - type: web
    name: datepilot
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://datepilot-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
