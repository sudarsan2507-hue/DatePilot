services:
  - type: web
    name: datepilot-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_PATH
        value: /tmp/datepilot.db
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: gemma3:4b
      - key: VISION_MODEL
        value: llava:7b
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: datepilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: datepilot-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
